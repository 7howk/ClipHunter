name: cliphunter-production

x-backend: &backend
  build:
    context: ../backend

x-database: &database
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}

x-storage: &storage
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Set the R2 S3 API endpoint in .env}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
  S3_REGION: ${S3_REGION:-auto}
  S3_TRANSFER_TIMEOUT_SECONDS: ${S3_TRANSFER_TIMEOUT_SECONDS:-300}

services:
  migrate:
    <<: *backend
    image: cliphunter-migrate:${CLIPHUNTER_VERSION:-0.1.0}
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database
      APP_ENV: production

  api:
    <<: *backend
    image: cliphunter-api:${CLIPHUNTER_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      <<: [*database, *storage]
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-${S3_ENDPOINT_URL}}
      HIGHLIGHT_MIN_SCORE: ${HIGHLIGHT_MIN_SCORE:-60}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}
      MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-1800}
      UPLOAD_DISK_RESERVE_MB: ${UPLOAD_DISK_RESERVE_MB:-64}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-2}
      UPLOAD_TIMEOUT_SECONDS: ${UPLOAD_TIMEOUT_SECONDS:-900}
      FFPROBE_TIMEOUT_SECONDS: ${FFPROBE_TIMEOUT_SECONDS:-20}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *backend
    image: cliphunter-worker:${CLIPHUNTER_VERSION:-0.1.0}
    command: ["python", "-m", "cliphunter.worker"]
    restart: unless-stopped
    environment:
      <<: [*database, *storage]
      APP_ENV: production
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
      GROQ_STT_MODEL: ${GROQ_STT_MODEL:-whisper-large-v3-turbo}
      GROQ_LLM_MODEL: ${GROQ_LLM_MODEL:-openai/gpt-oss-120b}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-60}
      HIGHLIGHT_MIN_SCORE: ${HIGHLIGHT_MIN_SCORE:-60}
      PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-1800}
      CLIP_TIMEOUT_SECONDS: ${CLIP_TIMEOUT_SECONDS:-300}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: cliphunter-web:${CLIPHUNTER_VERSION:-0.1.0}
    build:
      context: ../frontend
      args:
        VITE_API_MODE: real
        VITE_MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}
        VITE_MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-1800}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8000
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
