[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cliphunter"
version = "0.1.0"
description = "ClipHunter backend foundation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.162.4,<0.163",
    "pydantic-settings>=2.16.2,<3",
    "uvicorn>=0.54.0,<0.55",
    "sqlalchemy[asyncio]>=2.0.57,<2.1",
    "asyncpg>=0.32,<1",
    "alembic>=1.20.1,<2",
    "boto3>=1.44.1,<2",
    "anyio>=4.16,<5",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16,<3",
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
    "boto3-stubs[s3]>=1.44.1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires TEST_DATABASE_URL and running PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
