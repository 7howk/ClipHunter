name: Backend checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: ["feature/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: cliphunter_test
          POSTGRES_USER: cliphunter
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cliphunter -d cliphunter_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://cliphunter:test-password@localhost:5432/cliphunter_test
      TEST_DATABASE_URL: postgresql+asyncpg://cliphunter:test-password@localhost:5432/cliphunter_test
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: alembic upgrade head
      - run: pytest
      - run: alembic check
      - name: Check reversible migrations on disposable test database
        run: |
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:fsd
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f infra/docker-compose.yml config --quiet
      - run: docker compose --env-file .env -f infra/docker-compose.yml up --build --wait --wait-timeout 180
      - name: Check running services
        run: |
          curl --fail --silent http://localhost:8000/api/v1/health
          curl --fail --silent --output /dev/null http://localhost:8000/docs
          curl --fail --silent --output /dev/null http://localhost:8000/openapi.json
          curl --fail --silent http://localhost:9000/minio/health/ready
          curl --fail --silent --output /dev/null http://localhost:8080/
          curl --fail --silent --output /dev/null http://localhost:8080/upload
          curl --fail --silent http://localhost:8080/api/v1/health
          docker compose --env-file .env -f infra/docker-compose.yml exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1;"'
      - name: Check video upload with real PostgreSQL and multipart MinIO
        run: docker compose --env-file .env -f infra/docker-compose.yml exec -T api python - < backend/tests/integration/smoke_upload.py
      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/docker-compose.yml logs --tail=100
      - name: Stop services
        if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down
